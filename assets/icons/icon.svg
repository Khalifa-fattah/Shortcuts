<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="keyTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background App Rounded Rectangle -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Glowing Accent Border & Glow -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.6"/>

  <!-- Keyboard Graphic Group -->
  <g filter="url(#shadow)">
    <!-- Main Keyboard Body -->
    <rect x="80" y="120" width="352" height="272" rx="28" fill="#0f172a" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>

    <!-- Key Rows -->
    <!-- Row 1: Function Keys -->
    <rect x="108" y="148" width="56" height="48" rx="10" fill="url(#keyTopGrad)" stroke="#475569" stroke-width="1.5"/>
    <text x="136" y="178" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Esc</text>

    <rect x="176" y="148" width="56" height="48" rx="10" fill="url(#keyTopGrad)" stroke="#475569" stroke-width="1.5"/>
    <text x="204" y="178" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">F1</text>

    <rect x="244" y="148" width="56" height="48" rx="10" fill="url(#keyTopGrad)" stroke="#475569" stroke-width="1.5"/>
    <text x="272" y="178" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">F2</text>

    <rect x="312" y="148" width="92" height="48" rx="10" fill="url(#accentGrad)"/>
    <path d="M362 166 L350 172 L362 178" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="352" y1="172" x2="376" y2="172" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <!-- Row 2: Alpha Keys -->
    <rect x="108" y="210" width="76" height="54" rx="12" fill="url(#keyTopGrad)" stroke="#475569" stroke-width="1.5"/>
    <text x="146" y="244" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Tab</text>

    <rect x="196" y="210" width="60" height="54" rx="12" fill="url(#keyTopGrad)" stroke="#475569" stroke-width="1.5"/>
    <text x="226" y="244" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="800" text-anchor="middle">Q</text>

    <rect x="268" y="210" width="60" height="54" rx="12" fill="url(#accentGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <text x="298" y="245" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="900" text-anchor="middle">C</text>

    <rect x="340" y="210" width="64" height="54" rx="12" fill="url(#keyTopGrad)" stroke="#475569" stroke-width="1.5"/>
    <text x="372" y="244" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="800" text-anchor="middle">V</text>

    <!-- Row 3: Command & Spacebar -->
    <!-- CTRL KEY (Glowing) -->
    <rect x="108" y="278" width="84" height="54" rx="12" fill="url(#accentGrad)" stroke="#60a5fa" stroke-width="2"/>
    <text x="150" y="312" fill="#ffffff" font-family="system-ui, sans-serif" font-size="19" font-weight="800" text-anchor="middle">Ctrl</text>

    <!-- WIN KEY -->
    <rect x="204" y="278" width="64" height="54" rx="12" fill="url(#keyTopGrad)" stroke="#475569" stroke-width="1.5"/>
    <g transform="translate(224, 294) scale(0.65)">
      <path d="M0 3.5L10 2V12H0V3.5ZM0 13H10V23L0 21.5V13ZM11 1.8L25 0V12H11V1.8ZM25 13L11 13V23.2L25 25V13Z" fill="#38bdf8"/>
    </g>

    <!-- SPACEBAR -->
    <rect x="280" y="278" width="124" height="54" rx="12" fill="url(#keyTopGrad)" stroke="#475569" stroke-width="1.5"/>
  </g>

  <!-- Sparkle Stars for AI Feature -->
  <g transform="translate(370, 75) scale(1.3)" fill="#f59e0b">
    <path d="M12 2 L14 8 L20 10 L14 12 L12 18 L10 12 L4 10 L10 8 Z"/>
  </g>
  <g transform="translate(85, 80) scale(0.9)" fill="#8b5cf6">
    <path d="M12 2 L14 8 L20 10 L14 12 L12 18 L10 12 L4 10 L10 8 Z"/>
  </g>
</svg>
